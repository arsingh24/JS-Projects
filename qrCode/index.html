<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #3298cb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            border: 5px solid #000;
            padding: 10px;
            width: 500px;
            border-radius: 10px;
            background: aliceblue;
        }
        h2{
            font-size: 2rem;
        }
        input{
            display: block;
            width: 70%;
            text-align: center;
            padding: 5px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
        }
        button{
            padding: 10px;
            border-radius: 12px;
            background-color: rgb(105, 235, 105);
            font-size: 1rem;
        }
        img{
            padding: 10px;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>QR Code Generator</h2>
        <input type="text" id="input" placeholder="Enter your text">
        <button id="btn">Click here to generate QR Code</button>
        <img src="" alt="" id="img">
    </div>
</body>
<script src="script.js"></script>
</html>
