<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Count</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <textarea name="" id="text" placeholder="Enter your text"></textarea>
        <div class="outer">
            <div class="outside">
                <p class="words">Words</p>
                <span data-word-count>0</span>
            </div>
            <div class="outside">
                <p class="Sentences">Sentences</p>
                <span data-sentence-count>0</span>
            </div>
            <div class="outside">
                <p class="Paragraph">Paragraph</p>
                <span data-paragraph-count>0</span>
            </div>
            <div class="outside">
                <p class="Characters">Characters</p>
                <span data-character-count>0</span>
            </div>
        </div>
    </div>

    
   <script src="script.js"></script> 
</body>
</html>
