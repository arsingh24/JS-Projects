<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Increasing card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/280e6d29ec.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container">
        <div class="card">
            <i class="fa-brands fa-youtube" id="youtube"></i>
            <div class="counter" data-target="10000">10000</div>
            <span>Youtube Subscriber</span>
        </div>
        <div class="card">
            <i class="fa-brands fa-twitter" id="twitter"></i>
            <div class="counter" data-target="8000">8000</div>
            <span>Twitter Followers</span>
        </div>
        <div class="card">
            <i class="fa-brands fa-github" id="git"></i>
            <div class="counter" data-target="6000">6000</div>
            <span>Github Followers</span>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
