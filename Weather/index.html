<!DOCTYPE html>
<html lang="en">        
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Jan Lo</title>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <div class="container">
        <!-- search bar -->
        <div class="search">
            <input type="text" placeholder="Enter your City Name" spellcheck="false">
            <button><img src="./search.svg" alt=""></button>
        </div>
        <!-- weather info -->
         <div class="weather">
            <img src="./Img/rain.png" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city"> Patna</h2>
            <h4 class="type">Type</h4>

            <div class="details">
                <div class="col">
                    <img src="./Img/humidity.png" alt="">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="./Img/wind.png" alt="">
                    <div>
                        <p class="wind">15Km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
            <div class="details">
                <div class="col">
                    <img class="temp" src="./temperature.svg" alt="">
                    <div>
                        <p>Feels Like</p>
                        <p class="feels">15</p>
                    </div>
                </div>
                <div class="col">
                    <div  class="lola">
                        <p>Longitude : </p>
                        <p class="long">15</p>
                    </div>
                    <div class="lola">
                        <p>Latitute :</p>
                        <p class="lati">15</p>
                    </div>
                </div>
            </div>
         </div>
    </div>
</body>
<script src="script.js"></script>
</html>
