<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #f9c05d;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 300px;
            padding: 10px;
            border-radius: 10px;
            gap: 10px;
            border: 5px solid #000;
            background-color: #fff;
            box-shadow: 15px 15px 5px orange;
        }
        .container:hover{
            background-color: #90c7fa;
            font-size: 2rem;
            width: 500px;
            border: 5px dashed  #9f0af5;
            color: rgb(255, 81, 1);
        }
        @media screen and (max-width:500px) {
            body{
                background-color: #fff;
            }
            .container{
                height: 40vh;
                /* background: #000; */
                padding:0px;
                cursor: pointer;
                background-color: #fd5353;
                box-shadow: -15px -15px 5px rgb(252, 187, 66);
            }
            input{
            display: block;
            width: 90%;
            text-align: center;
            padding: 10px;
            border: none;
            font-size: 1.2rem;
            color: aquamarine;
            background-color: #000;
            cursor: pointer;
        }
       
        }   
        input{
            display: block;
            width: 60%;
            text-align: center;
            padding: 10px;
            border-radius: 50px;
            border: none;
            font-size: 1.2rem;
        }
        h2, p{
            font-size: 1.5rem;
            font-weight: 600;
            color: rgb(0, 210, 140);
        }
        h2, p:hover{
            font-size: 1.5rem;
            font-weight: 600;
            color: rgb(237, 191, 10);
        }
        button{
            width: 50%;
            font-size: 1.2rem;
            padding: 6px;
            background-color: black;
            color: aliceblue;
            border-radius: 5px;
        }


    </style>
</head>
<body>
    <div class="container">
        <h2>Age Calculator</h2>
        <h4>Select your date of birth</h4>
        <input type="date" name="Enter your date" id="date">
        <button id="btn"> Calculate Age</button>
        <p>Your Age : <span id="age"></span></p>
    </div>
</body>
<script>
    const input =  document.querySelector('#date');
    const age = document.querySelector('#age');
    const btn = document.querySelector('#btn');

    const today = new Date();

    btn.addEventListener('click',()=>{

        if(!input.value){
            alert("Enter your Age")
        }
        else{
            console.log(today);
            console.log(input.value);
            
            const dob = new Date(input.value);
            console.log(dob.getFullYear());
            
            const dob_yr = dob.getFullYear();
            const today_yr = today.getFullYear();
            

            console.log(dob_yr);
            console.log(today_yr);

            const todayAge = today_yr - dob_yr;
            console.log(todayAge);
            age.innerHTML = `<span>${todayAge}</span>`

        }
        
    })


</script>
</html>
